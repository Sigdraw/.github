name: Bug report
description: Report a bug in a Sigdraw open-source project.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues before opening a new one.

        This tracker is for Sigdraw's open-source projects only. For the Sigdraw app, use [sigdraw.com/feedback](https://www.sigdraw.com/feedback). To report a security vulnerability, follow the [security policy](https://github.com/Sigdraw/.github/blob/main/SECURITY.md) instead of opening an issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        The smallest code, input file, or command sequence that reproduces the problem. Link to a repository or gist if it does not fit here.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Include full error messages, panics, or backtraces (`RUST_BACKTRACE=1`) where relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The crate version, release, or commit hash you are using.
      placeholder: e.g. 0.1.0 or a1b2c3d
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Operating system, version, and architecture.
      placeholder: e.g. macOS 15.1 (arm64), Ubuntu 24.04 (x86_64), Windows 11
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Rust toolchain
      description: Output of `rustc --version`.
      placeholder: e.g. rustc 1.91.0 (f8297e351 2025-10-28)
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help, such as GPU and driver for rendering issues, or relevant feature flags.
    validations:
      required: false
