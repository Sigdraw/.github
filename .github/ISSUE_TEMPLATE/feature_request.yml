name: Feature request
description: Suggest an improvement or new feature for a Sigdraw open-source project.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search existing issues before opening a new one.

        This tracker is for Sigdraw's open-source projects only. For the Sigdraw app, use [sigdraw.com/feedback](https://www.sigdraw.com/feedback).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Describe the use case rather than only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like this to work. Include example code or API sketches if helpful.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to relevant standards (for example, IEEE 1800 clauses), prior art, or anything else that helps.
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this feature.
          required: false
